<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Board Game (debug client)</title>
  </head>
  <body>
    <main>
      <h1>Card Board Game — debug client</h1>
      <p><a href="/readme/">About this app</a></p>
      <p id="status">connecting...</p>
      <div id="board"></div>
      <p>Hand (click to select, then click a board cell):</p>
      <div id="hand"></div>
      <p>
        <button id="draw-btn">Draw</button>
        <button id="endturn-btn">End Turn</button>
        <button id="newgame-btn">New Game</button>
      </p>
      <pre id="log"></pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
