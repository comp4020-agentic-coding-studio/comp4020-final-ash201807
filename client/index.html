<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Board Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      /* Stage A — Modern Minimalism visual foundation. Still a functional
         layout, no new DOM: every rule below targets a selector that already
         existed in this file. Tokens defined as CSS custom properties so
         colour/spacing/radius/font stay centralised in one place.

         Contrast verified against this file's own two backgrounds
         (--color-bg #F7F6F0, --color-surface #FFFFFF) using WCAG 2.1's
         relative-luminance formula via a standalone script, not eyeballed —
         see the Stage A/A-followup reports for the full numbers. Findings
         that drove deviations from the initial colour brief:
         - #879C82 (primary) and #D99A70 (accent) both fail 4.5:1 as
           *foreground text* on either background (primary: 2.73:1 on bg,
           2.95:1 on surface; accent: 2.20:1 on bg, 2.38:1 on surface) —
           neither is used as a text colour below; both are used as
           fills/borders with dark (--color-text) text on top instead, or as
           non-text accents (underlines, focus rings).
         - --color-primary itself, used directly as a hover/focus *border* or
           outline against --color-surface, measured 2.95:1 — under WCAG
           1.4.11's 3:1 non-text-UI-component threshold. Rather than darken
           the brief's own fixed base sage-green value (keeping #879C82
           exactly as given), a second, separate token —
           --color-primary-strong (#5B6E54, same hue family, darkened for
           contrast only) — was added and used specifically where 3:1 is
           required: every button's default/hover border, the focus-visible
           outline, and the board's dividing grid lines. --color-primary
           itself is kept unchanged everywhere else (hover fill tint,
           link-hover colour, opponent card-back fill) so the overall
           warm-white/sage/apricot direction isn't uniformly darkened just to
           pass one check. --color-primary-strong against surface: 5.52:1;
           against page bg: 5.10:1; against board-grid bg (#E4E5DD): 4.35:1 —
           all clear 3:1 by a wide margin, confirmed via the same script.
         - A second real gap, found auditing every actual button/border pair
           rather than trusting the original Stage A pass: the default
           (non-hover, non-focus) button border used --color-border
           (#E4E5DD) against the button's own white fill — 1.27:1, nowhere
           near 3:1, meaning an unfocused idle button had almost no visible
           edge against the equally-white panel behind it. This was a real
           regression this stylesheet introduced (the pre-Stage-A button had
           no custom border colour at all), not a property of the colour
           brief. Fixed by giving every button's default border
           --color-primary-strong too (5.52:1), not just the hover/focus
           states — the hover rule's own border-color is now redundant with
           the default but left in place deliberately, so hover stays
           correct even if the default border colour is ever revisited
           independently. Decorative, non-interactive borders (the
           #quit-panel/#newgame-panel grouping divs, the opponent card-back)
           were deliberately left on --color-border/1.27:1 — WCAG 1.4.11
           only applies to UI components and meaningful graphical objects,
           not to static grouping/decoration, so darkening those wasn't
           needed and would have fought the "ample whitespace, light touch"
           brief for no accessibility benefit.
         - button:disabled (opacity: 0.5, unchanged from before Stage A) is
           explicitly exempt from WCAG 1.4.11's 3:1 requirement (inactive
           controls are excluded by the spec itself) — checked, not assumed:
           a 50%-opacity --color-primary-strong border over the page
           background computes to ~2.03:1, which would fail if disabled
           controls were in scope, but they aren't.
         - The brief left secondary/error colours open, to be checked against
           actual use. #73796F (an earlier candidate) measured 4.13:1 on bg /
           4.47:1 on surface, short of the 4.5:1 body-text threshold at the
           small sizes this page actually uses (0.75–0.9rem) — darkened to
           #5E6459 (5.63:1 on bg, 6.10:1 on surface). #B85D55 (an earlier
           error candidate) measured 4.44:1 with white text, short of 4.5:1 —
           darkened to #A8504A (5.37:1 with white text, 4.96:1 as standalone
           text on --color-bg) for the error banner; the disconnect banner
           (an already-distinct, more severe state) keeps its own deeper
           shade, --color-error-strong (8.45:1 with white text), for the same
           visual separation the original #5a1a1a/#7a4b00 pair had (13.15:1 /
           7.41:1 respectively). */
      :root {
        --color-bg: #f7f6f0;
        --color-surface: #ffffff;
        --color-text: #252923;
        --color-text-secondary: #5e6459;
        --color-primary: #879c82;
        --color-primary-subtle: #e8eee5;
        --color-primary-strong: #5b6e54;
        --color-accent: #d99a70;
        /* C2: derived from existing tokens, no new hues. accent-strong vs
           white 4.66:1 (B's board border, icon outlines). */
        --color-accent-strong: color-mix(in srgb, var(--color-accent) 60%, var(--color-text));
        --color-accent-subtle: color-mix(in srgb, var(--color-accent) 25%, #fff);
        --color-border: #e4e5dd;
        --cell-size: 64px;
        --color-error: #a8504a;
        --color-error-strong: #7a3a35;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;
        --space-8: 32px;

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;

        /* C1: Inter/Fraunces load from Google Fonts; system fonts remain
           the fallback so the page still renders correctly offline. */
        --font-sans: "Inter", system-ui, sans-serif;
        --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      }
      .is-hidden {
        /* !important: must beat ID-selector display rules (e.g. banners). */
        display: none !important;
      }
      body {
        font-family: var(--font-sans);
        /* C1: warm wash derived from existing tokens, no new colour values. */
        background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--color-accent) 22%, var(--color-bg)) 0%,
            var(--color-bg) 45%,
            var(--color-primary-subtle) 100%
          )
          fixed;
        color: var(--color-text);
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
      }
      .app {
        max-width: 960px;
        margin: 0 auto;
        padding: var(--space-6);
      }
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--space-3);
        margin-bottom: var(--space-6);
      }
      h1 {
        font-family: var(--font-display);
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .app-tagline {
        margin: var(--space-1) 0 0;
        color: var(--color-text-secondary);
      }
      .app-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-1);
        font-size: 0.85rem;
      }
      .label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-text-secondary);
      }
      a {
        color: var(--color-text);
        text-decoration-color: var(--color-accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 2px;
      }
      a:hover {
        color: var(--color-primary);
      }
      button {
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--color-text);
        background: var(--color-surface);
        border: 1px solid var(--color-primary-strong);
        border-radius: var(--radius-sm);
        padding: var(--space-2) var(--space-3);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      button:hover:not(:disabled) {
        border-color: var(--color-primary-strong);
        background: var(--color-primary-subtle);
      }
      button:focus-visible {
        outline: 2px solid var(--color-primary-strong);
        outline-offset: 1px;
      }
      #identity {
        color: var(--color-text-secondary);
        margin: 0;
      }
      .connection-status {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-text-secondary);
      }
      .connection-status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-error);
      }
      .connection-status.is-connected::before {
        background: var(--color-primary-strong);
      }
      .btn--primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        background: var(--color-primary-strong);
        border-color: var(--color-primary-strong);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 600;
        padding: var(--space-3) var(--space-8);
        border-radius: 999px;
      }
      .btn--primary:hover:not(:disabled) {
        background: var(--color-text);
        border-color: var(--color-text);
      }
      /* Dangerous action: error-coloured outline + text, not a fill, so it
         reads as serious without competing with the primary action. */
      .btn--danger {
        color: var(--color-error);
        border-color: var(--color-error);
        background: var(--color-surface);
      }
      .btn--danger:hover:not(:disabled) {
        background: var(--color-error);
        border-color: var(--color-error);
        color: #fff;
      }
      #disconnect-banner,
      #error-banner {
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-md);
        margin: 0 0 var(--space-4);
        font-weight: 600;
      }
      .lobby {
        max-width: 520px;
        margin: var(--space-8) auto;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
      }
      .lobby-ready {
        margin-top: var(--space-4);
        background: var(--color-primary-subtle);
        border-radius: var(--radius-md);
        padding: var(--space-6);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .lobby-ready .btn--primary {
        width: 100%;
      }
      .game {
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
      }
      .game-topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
      }
      .game-topbar p {
        margin: 0;
      }
      .score {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #turn-indicator {
        font-weight: 600;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 999px;
        padding: var(--space-2) var(--space-4);
      }
      #turn-indicator.is-my-turn {
        background: var(--color-primary-strong);
        border-color: var(--color-primary-strong);
        color: #fff;
      }
      .zone-title {
        display: flex;
        align-items: baseline;
        gap: var(--space-2);
        margin: 0 0 var(--space-3);
      }
      .zone-hint {
        margin: calc(-1 * var(--space-2)) 0 var(--space-3);
        font-size: 0.85rem;
        color: var(--color-text-secondary);
      }
      .battlefield {
        background: var(--color-primary);
        border-radius: var(--radius-lg);
        padding: var(--space-6);
        display: flex;
        justify-content: center;
      }
      .game-actions {
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
      #disconnect-banner {
        background: var(--color-error-strong);
        color: #fff;
      }
      #error-banner {
        background: var(--color-error);
        color: #fff;
      }
      #status-line {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0;
      }
      #series-score {
        font-size: 1.05rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      /* C3: HP/AP as label + large number; the HP bar is decorative
         (aria-hidden) — the number is the real value. */
      #hp-ap-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: var(--space-3);
        font-variant-numeric: tabular-nums;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
      }
      .stat-value {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.2;
      }
      .stat--ap {
        min-width: 72px;
      }
      .hp-bar {
        height: 6px;
        border-radius: 999px;
        background: var(--color-primary-subtle);
        overflow: hidden;
      }
      .hp-bar > span {
        display: block;
        height: 100%;
        background: var(--color-primary-strong);
        border-radius: inherit;
      }
      .hp-bar--opponent > span {
        background: var(--color-accent-strong);
      }
      .hp-bar--opponent {
        background: var(--color-accent-subtle);
      }
      #board {
        display: inline-grid;
        gap: var(--space-1);
        background: var(--color-primary-strong);
        padding: var(--space-1);
        border-radius: var(--radius-md);
      }
      /* C2 board cells. States are told apart by fill/border, not by the
         global disabled opacity, so owner colour stays legible on placed
         cards (which are always disabled). */
      #board button {
        width: var(--cell-size);
        height: var(--cell-size);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 2px solid transparent;
        background: var(--color-primary-subtle);
      }
      #board button:disabled {
        opacity: 1;
        cursor: default;
      }
      #board button.is-playable {
        background: var(--color-surface);
        border: 2px dashed var(--color-primary-strong);
        cursor: pointer;
      }
      #board button.is-playable:hover {
        background: var(--color-primary-subtle);
        border-style: solid;
      }
      #board button.owner-a {
        background: var(--color-surface);
        border: 2px solid var(--color-primary-strong);
      }
      #board button.owner-b {
        background: var(--color-accent-subtle);
        border: 2px solid var(--color-accent-strong);
      }
      #board button svg {
        display: block;
        width: 60%;
        height: 60%;
      }
      #opponent-hand {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      /* B1 card back: fixed pattern from app.js's OPPONENT_CARD_BACK_SVG,
         never changed by card contents. */
      #opponent-hand .card-back {
        display: inline-block;
        width: 60px;
        height: 36px;
        background: var(--color-primary-subtle);
        border: 1px solid var(--color-primary);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      #opponent-hand .card-back svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* C2 hand cards: vertical card, illustration on top, full name below.
         Name may wrap but is never clipped. */
      #hand {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        padding-top: var(--space-1);
      }
      #hand button {
        width: 104px;
        min-height: 128px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-3);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        font-size: 0.875rem;
        font-weight: 600;
        overflow-wrap: anywhere;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      #hand button svg {
        display: block;
        box-sizing: border-box;
        width: 100%;
        aspect-ratio: 1;
        padding: var(--space-3);
        background: var(--color-bg);
        border-radius: var(--radius-sm);
      }
      #hand button:hover:not(:disabled) {
        border-color: var(--color-primary-strong);
        background: var(--color-surface);
      }
      #hand button.selected {
        border: 2px solid var(--color-primary-strong);
        background: var(--color-primary-subtle);
        transform: translateY(-4px);
        padding: calc(var(--space-3) - 1px);
      }
      #hand button.selected svg {
        background: var(--color-surface);
      }
      #hand button:disabled {
        opacity: 1;
        color: var(--color-text-secondary);
      }
      #hand button:disabled svg {
        opacity: 0.7;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #quit-panel,
      #newgame-panel {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
      }
      #quit-panel p,
      #newgame-panel p {
        margin: 0 0 var(--space-2);
      }
      #quit-panel p:empty,
      #newgame-panel p:empty {
        display: none;
      }
      /* Quit negotiation: accent left edge marks "pending agreement";
         new-game panel uses the primary tint since it's the next step. */
      #quit-panel {
        border-left: 4px solid var(--color-accent);
      }
      #newgame-panel {
        background: var(--color-primary-subtle);
        border-color: var(--color-primary-subtle);
        border-left: 4px solid var(--color-primary-strong);
      }
      #newgame-btn {
        font-size: 0.95rem;
        padding: var(--space-2) var(--space-6);
      }
      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
      }
      /* Forfeit sits apart from the everyday turn actions to avoid misclicks. */
      .action-row--danger {
        margin-top: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid var(--color-border);
      }
      details#log-details {
        margin-top: var(--space-8);
        color: var(--color-text-secondary);
      }
      @media (max-width: 599px) {
        .app {
          padding: var(--space-3);
        }
        h1 {
          font-size: 1.75rem;
        }
        .app-meta {
          align-items: flex-start;
        }
        .lobby {
          margin: var(--space-4) 0;
          padding: var(--space-4);
        }
        .lobby-ready {
          padding: var(--space-4);
        }
        .battlefield {
          padding: var(--space-3);
        }
        :root {
          --cell-size: 52px;
        }
        #hand {
          gap: var(--space-2);
        }
        #hand button {
          width: 88px;
          min-height: 112px;
          padding: var(--space-2);
        }
        #hand button.selected {
          padding: calc(var(--space-2) - 1px);
        }
        #hand button svg {
          padding: var(--space-2);
        }
        #hp-ap-row {
          grid-template-columns: 1fr 1fr;
        }
        .stat {
          padding: var(--space-2) var(--space-3);
        }
        .stat--ap {
          grid-column: 1 / -1;
          flex-direction: row;
          align-items: baseline;
          gap: var(--space-2);
        }
        .game-actions button {
          min-height: 44px;
        }
      }
      #log {
        font-size: 0.75rem;
        max-height: 150px;
        overflow-y: auto;
        background: var(--color-primary-subtle);
        border-radius: var(--radius-sm);
        padding: var(--space-2);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <h1>Card Board Game</h1>
          <p class="app-tagline">A quiet little strategy game.</p>
        </div>
        <div class="app-meta">
          <span id="connection-status" class="connection-status"
            ><span id="connection-status-text">Connecting…</span></span
          >
          <p id="identity">connecting…</p>
          <a href="/readme/">About this app</a>
        </div>
      </header>

      <div id="disconnect-banner" class="is-hidden">Connection lost. Reload this page to reconnect — your place is saved.</div>
      <div id="error-banner" class="is-hidden"></div>

      <section id="lobby-panel" class="lobby">
        <p class="label">Matchmaking</p>
        <div class="lobby-ready">
          <p id="status-line">Connecting…</p>
          <button id="joinqueue-btn" class="btn--primary is-hidden">
            Join queue<span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <section id="game-panel" class="game is-hidden">
        <div class="game-topbar">
          <div class="score">
            <span class="label">Match score</span>
            <p id="series-score"></p>
          </div>
          <p id="turn-indicator"></p>
        </div>
        <div id="hp-ap-row">
          <div class="stat">
            <span class="label">Your HP</span>
            <span id="my-hp" class="stat-value"></span>
            <span class="hp-bar" aria-hidden="true"><span id="my-hp-bar"></span></span>
          </div>
          <div class="stat">
            <span class="label">Opponent HP</span>
            <span id="opp-hp" class="stat-value"></span>
            <span class="hp-bar hp-bar--opponent" aria-hidden="true"><span id="opp-hp-bar"></span></span>
          </div>
          <div class="stat stat--ap">
            <span class="label">AP</span>
            <span id="ap-display" class="stat-value"></span>
          </div>
        </div>

        <div class="game-zone">
          <h2 class="zone-title label">Opponent's hand <span>(<span id="opp-hand-count">0</span>)</span></h2>
          <div id="opponent-hand"></div>
        </div>

        <div class="battlefield">
          <div id="board"></div>
        </div>

        <div class="game-zone">
          <h2 class="zone-title label">Your hand</h2>
          <p class="zone-hint">Pick a card, then a board cell.</p>
          <div id="hand"></div>
        </div>

        <div class="game-actions">
          <div class="action-row">
            <button id="draw-btn">Draw</button>
            <button id="endturn-btn">End Turn</button>
          </div>

          <div id="quit-panel" class="is-hidden">
            <p id="quit-status"></p>
            <div class="action-row">
              <button id="requestquit-btn">Offer to end game early</button>
              <button id="cancelquit-btn" class="is-hidden">Cancel my offer</button>
              <button id="acceptquit-btn" class="is-hidden">Accept — end game early</button>
              <button id="declinequit-btn" class="is-hidden">Decline</button>
            </div>
          </div>

          <div class="action-row action-row--danger">
            <button id="forfeit-btn" class="btn--danger">Forfeit whole match</button>
          </div>

          <div id="newgame-panel" class="is-hidden">
            <p id="newgame-status"></p>
            <button id="newgame-btn" class="btn--primary">Ready for next game</button>
          </div>
        </div>
      </section>

      <details id="log-details">
        <summary>Debug log</summary>
        <pre id="log"></pre>
      </details>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
